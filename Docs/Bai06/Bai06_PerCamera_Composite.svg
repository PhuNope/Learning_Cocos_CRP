<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1160" width="1600" height="1160"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L0 6 L8 3 z" fill="#a8bfd8"/></marker></defs><rect width="1600" height="1160" fill="#0b1324"/><text x="58" y="70" font-size="37" fill="#edf5ff" font-weight="700" font-family="DejaVu Sans,Arial,sans-serif" text-anchor="start">BÀI 6  |  POSTFX RIÊNG TỪNG CAMERA</text><text x="60" y="112" font-size="24" fill="#a8bfd8" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif" text-anchor="start">Mỗi Camera có resource riêng; chỉ RenderWindow là đầu ra chung</text><rect x="60" y="155" width="710" height="630" rx="24" fill="#101c31" stroke="#49b4ff" stroke-width="2"/><rect x="830" y="155" width="710" height="630" rx="24" fill="#101c31" stroke="#be92fa" stroke-width="2"/><text x="415" y="204" font-size="27" fill="#49b4ff" font-weight="700" font-family="DejaVu Sans,Arial,sans-serif" text-anchor="middle">CAMERA WORLD</text><text x="1185" y="204" font-size="27" fill="#be92fa" font-weight="700" font-family="DejaVu Sans,Arial,sans-serif" text-anchor="middle">CAMERA OVERLAY</text><rect x="115" y="246" width="600" height="109" rx="18" fill="#131f36" stroke="#49b4ff" stroke-width="2"/><text x="415.0" y="288" font-size="27" fill="#edf5ff" font-weight="700" font-family="DejaVu Sans,Arial,sans-serif" text-anchor="middle">ScenePass</text><text x="415.0" y="322" font-size="20" fill="#a8bfd8" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif" text-anchor="middle">SceneColor_W</text><line x1="415" y1="361" x2="415" y2="404" stroke="#a8bfd8" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/><rect x="115" y="417" width="600" height="109" rx="18" fill="#131f36" stroke="#49b4ff" stroke-width="2"/><text x="415.0" y="459" font-size="27" fill="#edf5ff" font-weight="700" font-family="DejaVu Sans,Arial,sans-serif" text-anchor="middle">FXPass</text><text x="415.0" y="493" font-size="20" fill="#a8bfd8" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif" text-anchor="middle">FXColor_W</text><line x1="415" y1="532" x2="415" y2="575" stroke="#a8bfd8" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/><rect x="115" y="588" width="600" height="109" rx="18" fill="#131f36" stroke="#49b4ff" stroke-width="2"/><text x="415.0" y="630" font-size="27" fill="#edf5ff" font-weight="700" font-family="DejaVu Sans,Arial,sans-serif" text-anchor="middle">Composite opaque</text><text x="415.0" y="664" font-size="20" fill="#a8bfd8" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif" text-anchor="middle">WRITE → Window</text><rect x="885" y="246" width="600" height="109" rx="18" fill="#131f36" stroke="#be92fa" stroke-width="2"/><text x="1185.0" y="288" font-size="27" fill="#edf5ff" font-weight="700" font-family="DejaVu Sans,Arial,sans-serif" text-anchor="middle">ScenePass</text><text x="1185.0" y="322" font-size="20" fill="#a8bfd8" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif" text-anchor="middle">SceneColor_O (alpha 0)</text><line x1="1185" y1="361" x2="1185" y2="404" stroke="#a8bfd8" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/><rect x="885" y="417" width="600" height="109" rx="18" fill="#131f36" stroke="#be92fa" stroke-width="2"/><text x="1185.0" y="459" font-size="27" fill="#edf5ff" font-weight="700" font-family="DejaVu Sans,Arial,sans-serif" text-anchor="middle">FXPass</text><text x="1185.0" y="493" font-size="20" fill="#a8bfd8" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif" text-anchor="middle">FXColor_O</text><line x1="1185" y1="532" x2="1185" y2="575" stroke="#a8bfd8" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/><rect x="885" y="588" width="600" height="109" rx="18" fill="#131f36" stroke="#be92fa" stroke-width="2"/><text x="1185.0" y="630" font-size="27" fill="#edf5ff" font-weight="700" font-family="DejaVu Sans,Arial,sans-serif" text-anchor="middle">Composite alpha</text><text x="1185.0" y="664" font-size="20" fill="#a8bfd8" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif" text-anchor="middle">LOAD + Alpha blend</text><rect x="300" y="825" width="1000" height="107" rx="18" fill="#1c2b44" stroke="#49dbbb" stroke-width="2"/><text x="800" y="866" font-size="30" fill="#49dbbb" font-weight="700" font-family="DejaVu Sans,Arial,sans-serif" text-anchor="middle">RenderWindow = World + Overlay</text><text x="800" y="901" font-size="23" fill="#a8bfd8" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif" text-anchor="middle">World xuất trước; Overlay blend lên sau</text><line x1="415" y1="783" x2="620" y2="818" stroke="#a8bfd8" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/><line x1="1185" y1="783" x2="975" y2="818" stroke="#a8bfd8" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/><rect x="60" y="974" width="1480" height="131" rx="15" fill="#19263c" stroke="#ffc66d" stroke-width="2"/><text x="98" y="1017" font-size="26" fill="#ffc66d" font-weight="700" font-family="DejaVu Sans,Arial,sans-serif" text-anchor="start">CHÚ Ý</text><text x="283" y="1017" font-size="23" fill="#edf5ff" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif" text-anchor="start">Nếu Camera Overlay CLEAR Color thì World có thể bị xóa.</text><text x="283" y="1058" font-size="23" fill="#a8bfd8" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif" text-anchor="start">Nếu pass cuối không bật Blend thì LOAD vẫn có thể bị ghi đè.</text></svg>