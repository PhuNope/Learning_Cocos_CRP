<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L0 6 L8 3 z" fill="#a8bfd8"/></marker></defs><rect width="1600" height="1100" fill="#0b1324"/><text x="60" y="77" font-size="40" fill="#edf5ff" font-weight="700" font-family="DejaVu Sans,Arial,sans-serif" text-anchor="start">BÀI 6  |  VÒNG ĐỜI RESOURCE</text><text x="60" y="120" font-size="23" fill="#a8bfd8" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif" text-anchor="start">Một tên resource  →  khai báo  →  sử dụng  →  quản lý GPU</text><rect x="70" y="190" width="440" height="110" rx="18" fill="#131f36" stroke="#49dbbb" stroke-width="2"/><text x="290.0" y="232" font-size="25" fill="#edf5ff" font-weight="700" font-family="DejaVu Sans,Arial,sans-serif" text-anchor="middle">windowResize()</text><text x="290.0" y="266" font-size="20" fill="#a8bfd8" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif" text-anchor="middle">Khởi tạo / đổi kích thước</text><rect x="580" y="190" width="440" height="110" rx="18" fill="#131f36" stroke="#49b4ff" stroke-width="2"/><text x="800.0" y="232" font-size="25" fill="#edf5ff" font-weight="700" font-family="DejaVu Sans,Arial,sans-serif" text-anchor="middle">setup()</text><text x="800.0" y="266" font-size="20" fill="#a8bfd8" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif" text-anchor="middle">Dựng RenderGraph mỗi frame</text><rect x="1090" y="190" width="440" height="110" rx="18" fill="#131f36" stroke="#be92fa" stroke-width="2"/><text x="1310.0" y="232" font-size="25" fill="#edf5ff" font-weight="700" font-family="DejaVu Sans,Arial,sans-serif" text-anchor="middle">Executor / GPU</text><text x="1310.0" y="266" font-size="20" fill="#a8bfd8" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif" text-anchor="middle">Thực thi và cấp phát khi cần</text><line x1="515" y1="246" x2="573" y2="246" stroke="#a8bfd8" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/><line x1="1025" y1="246" x2="1083" y2="246" stroke="#a8bfd8" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/><rect x="70" y="350" width="440" height="104" rx="18" fill="#131f36" stroke="#29415f" stroke-width="2"/><rect x="580" y="350" width="440" height="104" rx="18" fill="#131f36" stroke="#29415f" stroke-width="2"/><rect x="1090" y="350" width="440" height="104" rx="18" fill="#131f36" stroke="#29415f" stroke-width="2"/><text x="290" y="391" font-size="24" fill="#49dbbb" font-weight="700" font-family="DejaVu Sans,Arial,sans-serif" text-anchor="middle">addRenderWindow()</text><text x="290" y="427" font-size="18" fill="#a8bfd8" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif" text-anchor="middle">Khai báo kích thước + format</text><text x="800" y="391" font-size="19" fill="#49b4ff" font-weight="700" font-family="DejaVu Sans,Arial,sans-serif" text-anchor="middle">pass.addRenderTarget(Window)</text><text x="800" y="427" font-size="18" fill="#a8bfd8" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif" text-anchor="middle">Đọc/ghi resource theo tên</text><text x="1310" y="391" font-size="20" fill="#be92fa" font-weight="700" font-family="DejaVu Sans,Arial,sans-serif" text-anchor="middle">Màn hình / RenderTexture</text><text x="1310" y="427" font-size="18" fill="#a8bfd8" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif" text-anchor="middle">GPU do engine quản lý</text><line x1="515" y1="400" x2="573" y2="400" stroke="#a8bfd8" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/><line x1="1025" y1="400" x2="1083" y2="400" stroke="#a8bfd8" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/><rect x="70" y="485" width="440" height="104" rx="18" fill="#131f36" stroke="#29415f" stroke-width="2"/><rect x="580" y="485" width="440" height="104" rx="18" fill="#131f36" stroke="#29415f" stroke-width="2"/><rect x="1090" y="485" width="440" height="104" rx="18" fill="#131f36" stroke="#29415f" stroke-width="2"/><text x="290" y="526" font-size="24" fill="#49dbbb" font-weight="700" font-family="DejaVu Sans,Arial,sans-serif" text-anchor="middle">addRenderTarget()</text><text x="290" y="562" font-size="18" fill="#a8bfd8" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif" text-anchor="middle">Khai báo kích thước + format</text><text x="800" y="526" font-size="19" fill="#49b4ff" font-weight="700" font-family="DejaVu Sans,Arial,sans-serif" text-anchor="middle">pass.addRenderTarget(SceneColor)</text><text x="800" y="562" font-size="18" fill="#a8bfd8" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif" text-anchor="middle">Đọc/ghi resource theo tên</text><text x="1310" y="526" font-size="20" fill="#be92fa" font-weight="700" font-family="DejaVu Sans,Arial,sans-serif" text-anchor="middle">Ghi ảnh Scene vào texture</text><text x="1310" y="562" font-size="18" fill="#a8bfd8" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif" text-anchor="middle">GPU do engine quản lý</text><line x1="515" y1="535" x2="573" y2="535" stroke="#a8bfd8" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/><line x1="1025" y1="535" x2="1083" y2="535" stroke="#a8bfd8" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/><rect x="70" y="620" width="440" height="104" rx="18" fill="#131f36" stroke="#29415f" stroke-width="2"/><rect x="580" y="620" width="440" height="104" rx="18" fill="#131f36" stroke="#29415f" stroke-width="2"/><rect x="1090" y="620" width="440" height="104" rx="18" fill="#131f36" stroke="#29415f" stroke-width="2"/><text x="290" y="661" font-size="24" fill="#49dbbb" font-weight="700" font-family="DejaVu Sans,Arial,sans-serif" text-anchor="middle">addDepthStencil()</text><text x="290" y="697" font-size="18" fill="#a8bfd8" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif" text-anchor="middle">Khai báo kích thước + format</text><text x="800" y="661" font-size="19" fill="#49b4ff" font-weight="700" font-family="DejaVu Sans,Arial,sans-serif" text-anchor="middle">pass.addDepthStencil()</text><text x="800" y="697" font-size="18" fill="#a8bfd8" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif" text-anchor="middle">Đọc/ghi resource theo tên</text><text x="1310" y="661" font-size="20" fill="#be92fa" font-weight="700" font-family="DejaVu Sans,Arial,sans-serif" text-anchor="middle">Depth test / ghi độ sâu</text><text x="1310" y="697" font-size="18" fill="#a8bfd8" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif" text-anchor="middle">GPU do engine quản lý</text><line x1="515" y1="670" x2="573" y2="670" stroke="#a8bfd8" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/><line x1="1025" y1="670" x2="1083" y2="670" stroke="#a8bfd8" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/><rect x="70" y="781" width="1460" height="100" rx="16" fill="#142c36" stroke="#49dbbb" stroke-width="2"/><text x="106" y="824" font-size="27" fill="#49dbbb" font-weight="700" font-family="DejaVu Sans,Arial,sans-serif" text-anchor="start">POSTFX</text><text x="340" y="823" font-size="22" fill="#edf5ff" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif" text-anchor="start">pass.addTexture(SceneColor) → shader đọc → pass ghi RenderWindow</text><text x="340" y="855" font-size="19" fill="#a8bfd8" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif" text-anchor="start">addTexture là READ, không thay cho addRenderTarget (WRITE).</text><rect x="70" y="935" width="1460" height="114" rx="16" fill="#192945" stroke="#ffc66d" stroke-width="2"/><text x="105" y="978" font-size="25" fill="#ffc66d" font-weight="700" font-family="DejaVu Sans,Arial,sans-serif" text-anchor="start">CỐT LÕI</text><text x="305" y="978" font-size="24" fill="#edf5ff" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif" text-anchor="start">Đăng ký ≠ vẽ; LOAD ≠ cấp phát; tên resource không được trùng.</text><text x="305" y="1013" font-size="22" fill="#a8bfd8" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif" text-anchor="start">Không tự tạo resource mới trong setup() mỗi frame.</text></svg>