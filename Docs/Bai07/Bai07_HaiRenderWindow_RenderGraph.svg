<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="930" viewBox="0 0 1480 930"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6 Z" fill="#9BACBE"/></marker></defs><rect x="0" y="0" width="1480" height="930" fill="#F6F9FC"/><text x="65" y="65" fill="#15314D" font-size="32" font-weight="750" font-family="DejaVu Sans, sans-serif">Bài 7 — Ba Camera, hai RenderWindow</text><text x="65" y="99" fill="#52677D" font-size="17" font-family="DejaVu Sans, sans-serif">Hai Camera đầu cùng Window 0; Camera thứ ba render vào một RenderTexture / Window N</text><rect x="64" y="137" width="830" height="733" rx="20" fill="#F1F6FE" stroke="#C7D9EE" stroke-width="2"/><rect x="919" y="137" width="495" height="733" rx="20" fill="#F0F9F6" stroke="#CAE3D9" stroke-width="2"/><text x="90" y="178" text-anchor="start" fill="#2F76CF" font-size="24" font-weight="bold" font-family="DejaVu Sans, sans-serif">RenderWindow 0 — màn hình</text><text x="945" y="178" text-anchor="start" fill="#168974" font-size="22" font-weight="bold" font-family="DejaVu Sans, sans-serif">RenderWindow N — RenderTexture</text><rect x="90" y="214" width="364" height="95" rx="14" fill="#FFFFFF" stroke="#D7E1EB" stroke-width="1.5"/><rect x="90" y="214" width="7" height="95" rx="3" fill="#2F76CF"/><text x="109" y="247" text-anchor="start" fill="#15314D" font-size="19" font-weight="bold" font-family="DejaVu Sans, sans-serif">Main Camera / World</text><text x="109" y="272" text-anchor="start" fill="#52677D" font-size="15" font-weight="normal" font-family="DejaVu Sans, sans-serif">PostFX: Grayscale</text><rect x="501" y="214" width="364" height="95" rx="14" fill="#FFFFFF" stroke="#D7E1EB" stroke-width="1.5"/><rect x="501" y="214" width="7" height="95" rx="3" fill="#7554BC"/><text x="520" y="247" text-anchor="start" fill="#15314D" font-size="19" font-weight="bold" font-family="DejaVu Sans, sans-serif">OverlayCamera</text><text x="520" y="272" text-anchor="start" fill="#52677D" font-size="15" font-weight="normal" font-family="DejaVu Sans, sans-serif">PostFX: Invert + alpha</text><path d="M272 309 L272 355" fill="none" stroke="#9BACBE" stroke-width="2.5"  marker-end="url(#arrow)"/><path d="M683 309 L683 355" fill="none" stroke="#9BACBE" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="90" y="355" width="364" height="113" rx="14" fill="#FFFFFF" stroke="#D7E1EB" stroke-width="1.5"/><rect x="90" y="355" width="7" height="113" rx="3" fill="#2F76CF"/><text x="109" y="388" text-anchor="start" fill="#15314D" font-size="19" font-weight="bold" font-family="DejaVu Sans, sans-serif">SceneColor_W + SceneDepth_W</text><text x="109" y="413" text-anchor="start" fill="#52677D" font-size="15" font-weight="normal" font-family="DejaVu Sans, sans-serif">ScenePass: CLEAR → STORE</text><text x="109" y="436" text-anchor="start" fill="#52677D" font-size="15" font-weight="normal" font-family="DejaVu Sans, sans-serif">Ghi riêng hình World</text><rect x="501" y="355" width="364" height="113" rx="14" fill="#FFFFFF" stroke="#D7E1EB" stroke-width="1.5"/><rect x="501" y="355" width="7" height="113" rx="3" fill="#7554BC"/><text x="520" y="388" text-anchor="start" fill="#15314D" font-size="19" font-weight="bold" font-family="DejaVu Sans, sans-serif">SceneColor_O + SceneDepth_O</text><text x="520" y="413" text-anchor="start" fill="#52677D" font-size="15" font-weight="normal" font-family="DejaVu Sans, sans-serif">ScenePass: CLEAR alpha = 0</text><text x="520" y="436" text-anchor="start" fill="#52677D" font-size="15" font-weight="normal" font-family="DejaVu Sans, sans-serif">Ghi riêng hình Overlay</text><path d="M272 468 L272 505" fill="none" stroke="#9BACBE" stroke-width="2.5"  marker-end="url(#arrow)"/><path d="M683 468 L683 505" fill="none" stroke="#9BACBE" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="90" y="505" width="364" height="94" rx="14" fill="#FFFFFF" stroke="#D7E1EB" stroke-width="1.5"/><rect x="90" y="505" width="7" height="94" rx="3" fill="#2F76CF"/><text x="109" y="538" text-anchor="start" fill="#15314D" font-size="19" font-weight="bold" font-family="DejaVu Sans, sans-serif">FXColor_W</text><text x="109" y="563" text-anchor="start" fill="#52677D" font-size="15" font-weight="normal" font-family="DejaVu Sans, sans-serif">FX Pass: Grayscale</text><rect x="501" y="505" width="364" height="94" rx="14" fill="#FFFFFF" stroke="#D7E1EB" stroke-width="1.5"/><rect x="501" y="505" width="7" height="94" rx="3" fill="#7554BC"/><text x="520" y="538" text-anchor="start" fill="#15314D" font-size="19" font-weight="bold" font-family="DejaVu Sans, sans-serif">FXColor_O</text><text x="520" y="563" text-anchor="start" fill="#52677D" font-size="15" font-weight="normal" font-family="DejaVu Sans, sans-serif">FX Pass: Invert</text><path d="M272 599 L272 643" fill="none" stroke="#9BACBE" stroke-width="2.5"  marker-end="url(#arrow)"/><path d="M683 599 L683 643" fill="none" stroke="#9BACBE" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="90" y="643" width="364" height="110" rx="14" fill="#FFFFFF" stroke="#D7E1EB" stroke-width="1.5"/><rect x="90" y="643" width="7" height="110" rx="3" fill="#2F76CF"/><text x="109" y="676" text-anchor="start" fill="#15314D" font-size="19" font-weight="bold" font-family="DejaVu Sans, sans-serif">Compose World</text><text x="109" y="701" text-anchor="start" fill="#52677D" font-size="15" font-weight="normal" font-family="DejaVu Sans, sans-serif">RenderWindow 0: CLEAR + STORE</text><text x="109" y="724" text-anchor="start" fill="#52677D" font-size="15" font-weight="normal" font-family="DejaVu Sans, sans-serif">Không alpha blend</text><rect x="501" y="643" width="364" height="110" rx="14" fill="#FFFFFF" stroke="#D7E1EB" stroke-width="1.5"/><rect x="501" y="643" width="7" height="110" rx="3" fill="#7554BC"/><text x="520" y="676" text-anchor="start" fill="#15314D" font-size="19" font-weight="bold" font-family="DejaVu Sans, sans-serif">Compose Overlay</text><text x="520" y="701" text-anchor="start" fill="#52677D" font-size="15" font-weight="normal" font-family="DejaVu Sans, sans-serif">RenderWindow 0: LOAD + STORE</text><text x="520" y="724" text-anchor="start" fill="#52677D" font-size="15" font-weight="normal" font-family="DejaVu Sans, sans-serif">Alpha blending giữ ảnh World</text><path d="M454 699 L501 699" fill="none" stroke="#9BACBE" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="945" y="214" width="443" height="95" rx="14" fill="#FFFFFF" stroke="#D7E1EB" stroke-width="1.5"/><rect x="945" y="214" width="7" height="95" rx="3" fill="#168974"/><text x="964" y="247" text-anchor="start" fill="#15314D" font-size="19" font-weight="bold" font-family="DejaVu Sans, sans-serif">Camera thứ ba → Target Texture</text><text x="964" y="272" text-anchor="start" fill="#52677D" font-size="15" font-weight="normal" font-family="DejaVu Sans, sans-serif">Ví dụ: 512×512; Window ID do engine cấp</text><path d="M1166 309 L1166 355" fill="none" stroke="#9BACBE" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="945" y="355" width="443" height="113" rx="14" fill="#FFFFFF" stroke="#D7E1EB" stroke-width="1.5"/><rect x="945" y="355" width="7" height="113" rx="3" fill="#168974"/><text x="964" y="388" text-anchor="start" fill="#15314D" font-size="19" font-weight="bold" font-family="DejaVu Sans, sans-serif">SceneColor_RT + SceneDepth_RT</text><text x="964" y="413" text-anchor="start" fill="#52677D" font-size="15" font-weight="normal" font-family="DejaVu Sans, sans-serif">ScenePass trong Window N</text><text x="964" y="436" text-anchor="start" fill="#52677D" font-size="15" font-weight="normal" font-family="DejaVu Sans, sans-serif">Hoàn toàn độc lập Window 0</text><path d="M1166 468 L1166 505" fill="none" stroke="#9BACBE" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="945" y="505" width="443" height="94" rx="14" fill="#FFFFFF" stroke="#D7E1EB" stroke-width="1.5"/><rect x="945" y="505" width="7" height="94" rx="3" fill="#168974"/><text x="964" y="538" text-anchor="start" fill="#15314D" font-size="19" font-weight="bold" font-family="DejaVu Sans, sans-serif">FXColor_RT</text><text x="964" y="563" text-anchor="start" fill="#52677D" font-size="15" font-weight="normal" font-family="DejaVu Sans, sans-serif">FX Pass: Tint hoặc Invert</text><path d="M1166 599 L1166 643" fill="none" stroke="#9BACBE" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="945" y="643" width="443" height="110" rx="14" fill="#FFFFFF" stroke="#D7E1EB" stroke-width="1.5"/><rect x="945" y="643" width="7" height="110" rx="3" fill="#168974"/><text x="964" y="676" text-anchor="start" fill="#15314D" font-size="19" font-weight="bold" font-family="DejaVu Sans, sans-serif">Compose → RenderTexture</text><text x="964" y="701" text-anchor="start" fill="#52677D" font-size="15" font-weight="normal" font-family="DejaVu Sans, sans-serif">RenderWindow N: CLEAR + STORE</text><text x="964" y="724" text-anchor="start" fill="#52677D" font-size="15" font-weight="normal" font-family="DejaVu Sans, sans-serif">Không tự hiện thành cửa sổ mới</text><text x="91" y="811" text-anchor="start" fill="#2F76CF" font-size="16" font-weight="bold" font-family="DejaVu Sans, sans-serif">Kết quả: World + Overlay cùng hiển thị</text><text x="945" y="811" text-anchor="start" fill="#168974" font-size="16" font-weight="bold" font-family="DejaVu Sans, sans-serif">Kết quả: texture phụ riêng</text><text x="70" y="903" text-anchor="start" fill="#52677D" font-size="15" font-weight="normal" font-family="DejaVu Sans, sans-serif">Đọc kỹ: LoadOp.CLEAR chỉ xóa attachment đang chọn, không xóa các texture của Camera khác.</text></svg>