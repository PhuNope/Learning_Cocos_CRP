<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="830" viewBox="0 0 1600 830"><defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#091424"/><stop offset="1" stop-color="#0e2037"/></linearGradient>
        <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#91BAD4"/></marker>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000a17" flood-opacity=".5"/></filter>
        </defs><rect width="100%" height="100%" fill="url(#bg)"/><rect x="28" y="28" width="7" height="60" rx="3" fill="#3DDEC6"/><text x="52" y="61" font-size="32" font-weight="bold" fill="#F1F7FF" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif">BÀI 8  •  CLEAR / LOAD / ALPHA BLENDING</text><text x="53" y="91" font-size="16" font-weight="normal" fill="#BDD2E8" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif">CLEAR chỉ ảnh hưởng attachment của pass hiện tại; Compose dùng Window làm destination</text><rect x="65" y="160" width="450" height="230" rx="16" fill="#1C2F49" stroke="#64B5F6" stroke-width="2" filter="url(#shadow)"/><text x="290" y="215" font-size="19" font-weight="normal" fill="#F1F7FF" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif">1. WORLD COMPOSITE</text><text x="290" y="257" font-size="19" font-weight="normal" fill="#F1F7FF" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif">Target: Window0.Color</text><text x="290" y="299" font-size="19" font-weight="normal" fill="#F1F7FF" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif">LoadOp.CLEAR (camera đầu tiên)</text><text x="290" y="341" font-size="19" font-weight="normal" fill="#F1F7FF" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif">STORE → Window chứa ảnh World</text><rect x="595" y="160" width="440" height="230" rx="16" fill="#173D45" stroke="#3DDEC6" stroke-width="2" filter="url(#shadow)"/><text x="815" y="215" font-size="19" font-weight="normal" fill="#F1F7FF" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif">2. OVERLAY FX</text><text x="815" y="257" font-size="19" font-weight="normal" fill="#F1F7FF" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif">Target: Overlay.FxA</text><text x="815" y="299" font-size="19" font-weight="normal" fill="#F1F7FF" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif">LoadOp.CLEAR → chỉ xóa FxA</text><text x="815" y="341" font-size="19" font-weight="normal" fill="#F1F7FF" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif">Shader ghi ảnh Overlay + alpha</text><rect x="1115" y="160" width="430" height="230" rx="16" fill="#372A48" stroke="#D7ADFF" stroke-width="2" filter="url(#shadow)"/><text x="1330" y="215" font-size="19" font-weight="normal" fill="#F1F7FF" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif">3. OVERLAY COMPOSITE</text><text x="1330" y="257" font-size="19" font-weight="normal" fill="#F1F7FF" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif">Target: Window0.Color</text><text x="1330" y="299" font-size="19" font-weight="normal" fill="#F1F7FF" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif">LoadOp.LOAD giữ World</text><text x="1330" y="341" font-size="19" font-weight="normal" fill="#F1F7FF" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif">Alpha blend FxA với Window</text><path d="M 522 270 L 588 270" fill="none" stroke="#91BAD4" stroke-width="3" marker-end="url(#arrow)"/><path d="M 1041 270 L 1108 270" fill="none" stroke="#91BAD4" stroke-width="3" marker-end="url(#arrow)"/><rect x="100" y="489" width="1415" height="250" rx="16" fill="#112B3F" stroke="#519BCA" stroke-width="2" filter="url(#shadow)"/><text x="810" y="546" font-size="26" font-weight="bold" fill="#F1F7FF" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif">C_final = C_overlay × A_overlay  +  C_world × (1 − A_overlay)</text><text x="810" y="593" font-size="19" font-weight="normal" fill="#BDD2E8" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif">Overlay alpha = 0  →  giữ nguyên World;  Overlay alpha = 1  →  hiện Overlay</text><text x="810" y="639" font-size="19" font-weight="bold" fill="#FF8F9C" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif">Nếu Overlay Compose dùng CLEAR thay LOAD: World đã mất trước khi GPU blending.</text><text x="810" y="689" font-size="17" font-weight="normal" fill="#FFCF75" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif">Nếu Overlay SceneColor có nền alpha = 1: bật blending vẫn không nhìn xuyên qua nền.</text></svg>