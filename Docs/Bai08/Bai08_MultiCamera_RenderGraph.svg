, sans-serif">FX #1 Invert</text><text x="776.0" y="482" font-size="15" font-weight="normal" fill="#BDD2E8" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif">READ SceneColor • WRITE FxA</text><rect x="995" y="408" width="316" height="112" rx="16" fill="#182D48" stroke="#D7ADFF" stroke-width="2" filter="url(#shadow)"/><text x="1153.0" y="449" font-size="23" font-weight="bold" fill="#F1F7FF" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif">Composite Alpha</text><text x="1153.0" y="482" font-size="15" font-weight="normal" fill="#BDD2E8" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif">READ FxA • LOAD Window0</text><rect x="1370" y="408" width="320" height="112" rx="16" fill="#182D48" stroke="#64B5F6" stroke-width="2" filter="url(#shadow)"/><text x="1530.0" y="449" font-size="23" font-weight="bold" fill="#F1F7FF" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif">Window0.Color</text><text x="1530.0" y="482" font-size="15" font-weight="normal" fill="#BDD2E8" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif">World + Overlay blended</text><path d="M 564 465 L 613 465" fill="none" stroke="#91BAD4" stroke-width="3" marker-end="url(#arrow)"/><path d="M 941 465 L 990 465" fill="none" stroke="#91BAD4" stroke-width="3" marker-end="url(#arrow)"/><path d="M 1318 465 L 1366 465" fill="none" stroke="#91BAD4" stroke-width="3" marker-end="url(#arrow)"/><path d="M 1529 326 V 390 H 1160 V 405" stroke="#D7ADFF" stroke-width="3" fill="none" stroke-dasharray="9 8" marker-end="url(#arrow)"/><text x="1510" y="370" font-size="15" font-weight="normal" fill="#BDD2E8" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif">giữ màu World</text><rect x="204" y="578" width="1377" height="117" rx="16" fill="#183549" stroke="#428E9C" stroke-width="2" filter="url(#shadow)"/><text x="889" y="612" font-size="20" font-weight="normal" fill="#F1F7FF" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif">World: FxB là texture SOURCE của Composite Opaque.</text><text x="889" y="646" font-size="20" font-weight="normal" fill="#F1F7FF" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif">Overlay: FxA là texture SOURCE; Window0 là destination của alpha blending.</text><rect x="56" y="790" width="1698" height="255" rx="20" fill="#0D1B2D" stroke="#427D71" stroke-width="2" filter="url(#shadow)"/><text x="80" y="830" font-size="25" font-weight="bold" fill="#3DDEC6" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif">RENDERWINDOW 1  —  Camera thứ ba → RenderTexture</text><rect x="240" y="868" width="350" height="112" rx="16" fill="#182D48" stroke="#FFCF75" stroke-width="2" filter="url(#shadow)"/><text x="415.0" y="909" font-size="23" font-weight="bold" fill="#F1F7FF" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif">Camera #3 ScenePass</text><text x="415.0" y="942" font-size="15" font-weight="normal" fill="#BDD2E8" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif">SceneColor_C3</text><rect x="697" y="868" width="350" height="112" rx="16" fill="#182D48" stroke="#3DDEC6" stroke-width="2" filter="url(#shadow)"/><text x="872.0" y="909" font-size="23" font-weight="bold" fill="#F1F7FF" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif">FX Stage(s)</text><text x="872.0" y="942" font-size="15" font-weight="normal" fill="#BDD2E8" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif">FxA_C3 / FxB_C3</text><rect x="1160" y="868" width="480" height="112" rx="16" fill="#182D48" stroke="#D7ADFF" stroke-width="2" filter="url(#shadow)"/><text x="1400.0" y="909" font-size="23" font-weight="bold" fill="#F1F7FF" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif">Composite → Window1</text><text x="1400.0" y="942" font-size="15" font-weight="normal" fill="#BDD2E8" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif">RenderTexture, độc lập Window0</text><path d="M 597 925 L 682 925" fill